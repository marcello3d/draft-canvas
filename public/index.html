<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Web site created using create-react-app"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo192.png" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <title>DraftJS + Canvas2D</title>
    <style>
      /* Define specific weights for better Canvas2D compatibility */
      @font-face {
        font-family: 'Roboto';
        font-style: normal;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/Roboto/Roboto-VariableFont_wdth,wght.ttf') format('truetype-variations');
      }
      
      @font-face {
        font-family: 'Roboto';
        font-style: italic;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/Roboto/Roboto-Italic-VariableFont_wdth,wght.ttf') format('truetype-variations');
      }
      
      /* CJK Fonts */
      @font-face {
        font-family: 'Noto Sans SC';
        font-style: normal;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/Noto_Sans_SC/NotoSansSC-VariableFont_wght.ttf') format('truetype-variations');
      }
      
      @font-face {
        font-family: 'Noto Sans TC';
        font-style: normal;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/Noto_Sans_TC/NotoSansTC-VariableFont_wght.ttf') format('truetype-variations');
      }
      
      @font-face {
        font-family: 'Noto Sans JP';
        font-style: normal;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/Noto_Sans_JP/NotoSansJP-VariableFont_wght.ttf') format('truetype-variations');
      }
      
      @font-face {
        font-family: 'Noto Sans KR';
        font-style: normal;
        font-weight: 100 900;
        src: url('%PUBLIC_URL%/Noto_Sans_KR/NotoSansKR-VariableFont_wght.ttf') format('truetype-variations');
      }
      
      /* Emoji Font */
      @font-face {
        font-family: 'Noto Color Emoji';
        font-style: normal;
        font-weight: 400;
        src: url('%PUBLIC_URL%/Noto_Color_Emoji/NotoColorEmoji-Regular.ttf') format('truetype');
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
  </body>
</html>
